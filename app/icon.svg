    <!-- Thrown droplets. Kept chunky enough to survive rasterisation: below
         about 5 units they turn to mush at 16px. -->
    <ellipse cx="80.5" cy="86" rx="8.5" ry="7.5"/>
    <circle cx="88" cy="30" r="5.5"/>
